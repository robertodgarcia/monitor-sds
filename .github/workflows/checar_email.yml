name: Monitor de Email Policia

on:
  schedule:
    # Minuto 0
    # Horas: 10h às 23h UTC (equivale a 07h às 20h no horário local)
    # Dias: 1 (Segunda) até 6 (Sábado)
    - cron: '0 10-23 * * 1-6'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install requests PyPDF2

      - name: Diagnóstico rede (DNS + TCP 993 + IPv4/IPv6)
        run: |
          set -x
          echo "DNS:"
          getent ahosts imaps.expresso.pe.gov.br || true
      
          echo "Teste TCP 993 (genérico):"
          timeout 10 bash -lc 'cat < /dev/null > /dev/tcp/imaps.expresso.pe.gov.br/993' \
            && echo "TCP 993 OK" || echo "TCP 993 FALHOU"
      
          echo "Teste IPv4 explícito (se tiver nc):"
          (command -v nc >/dev/null && timeout 10 nc -4 -vz imaps.expresso.pe.gov.br 993) || true
      
          echo "Teste IPv6 explícito (se tiver nc):"
          (command -v nc >/dev/null && timeout 10 nc -6 -vz imaps.expresso.pe.gov.br 993) || true



      - name: Rodar monitor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor_bis.py
